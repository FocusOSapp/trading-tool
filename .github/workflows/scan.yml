name: Market Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [manual_scan]

permissions:
  contents: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance==0.2.51 pandas==2.2.3 numpy==1.26.4 ta==0.11.0 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Run market scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p data
          python scripts/scan.py || echo "Scan had errors but continuing..."
          ls -la data/

      - name: Commit data
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@trading.pro"
          git add data/
          git diff --cached --quiet || git commit -m "Market scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "Push failed"

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd frontend
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          npm ci || npm install

      - name: Build
        run: |
          cd frontend
          REACT_APP_API_URL='' npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          publish_branch: gh-pages

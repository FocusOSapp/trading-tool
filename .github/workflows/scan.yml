name: Market Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [manual_scan]

permissions:
  contents: write
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance==0.2.51 pandas==2.2.3 numpy==1.26.4 requests==2.32.3

      - name: Run market scan
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p data
          python3 scripts/scan.py 2>&1 || true
          echo "=== Data files ==="
          ls -la data/

      - name: Ensure data files exist
        run: |
          mkdir -p data
          for f in scan.json sectors.json signals.json overview.json news.json global.json breadth.json shockers.json fii_dii.json; do
            if [ ! -f "data/$f" ]; then
              echo '{}' > "data/$f"
              echo "Created empty data/$f"
            fi
          done
          echo "=== Final data files ==="
          ls -la data/

      - name: Commit data
        continue-on-error: true
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@trading.pro"
          git add data/
          git diff --cached --quiet || git commit -m "Market scan $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push || true

  deploy:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd frontend
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          npm ci || npm install

      - name: Build
        run: |
          cd frontend
          REACT_APP_API_URL='' npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          publish_branch: gh-pages
